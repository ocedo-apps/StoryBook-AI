<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryBook AI</title>
    <script>
      try {
        if (localStorage.getItem("storybook-ai.theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
        var loc = localStorage.getItem("storybook-ai.locale");
        if (loc) {
          document.documentElement.lang = loc.split("-")[0];
          document.documentElement.dataset.locale = loc;
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
